# Firmware upload over Bluetooth, for builds with MCUboot.
CONFIG_CHIP_DFU_OVER_BT_SMP=y

# Avoid a long blocking erase of the whole slot when an upload starts.
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Upload's defaults overflow RAM; the web app sends one small request at a time.
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=3
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Matter's 45 ms connection interval makes uploads take about half an hour.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Debug builds also need these to fit.
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_OPENTHREAD_MAX_CHILDREN=16