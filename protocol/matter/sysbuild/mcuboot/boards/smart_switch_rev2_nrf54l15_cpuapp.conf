# Secondary slot lives on the external W25Q32JV.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# 1.4 MB slot in 4 KB sectors.
CONFIG_BOOT_MAX_IMG_SECTORS=512

# Same workarounds as Nordic's nRF54L15 Matter samples: the stack guard causes false
# faults in the application after boot, and without a tickless kernel the reboot time
# grows on every software reset.
CONFIG_HW_STACK_PROTECTION=n
CONFIG_TICKLESS_KERNEL=y

CONFIG_BOOT_WATCHDOG_FEED=n
