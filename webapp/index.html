<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Configure your switch</title>
<style>
	:root {
		--ink: #eceee8;
		--paper: #12100d;
		--paper-raised: #1b1815;
		--patina: #7fbba9;
		--patina-strong: #9ed4c3;
		--copper: #d98a5e;
		--line: #3c3a34;
		--line-soft: #262420;
	}

	* { box-sizing: border-box; }

	body {
		font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
		max-width: 32rem;
		margin: 0 auto;
		padding: 3rem 1.25rem 4rem;
		background: var(--paper);
		color: var(--ink);
	}

	a { color: var(--patina-strong); }

	h1 {
		font-size: 1.4rem;
		font-weight: 700;
		letter-spacing: -0.01em;
		margin-bottom: 0.5rem;
	}

	p.lede {
		color: var(--ink);
		opacity: 0.7;
		font-size: 0.92rem;
		line-height: 1.5;
		margin-top: 0;
	}

	fieldset {
		margin-bottom: 1.1rem;
		border: 1px solid var(--line);
		border-radius: 6px;
		background: var(--paper-raised);
	}

	legend {
		font-weight: 600;
		font-size: 0.85rem;
		letter-spacing: 0.02em;
		padding: 0 0.4rem;
		color: var(--patina-strong);
	}

	label {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 1rem;
		margin: 0.6rem 0;
		font-size: 0.92rem;
	}

	label span { flex: 1; }

	input[type="number"] {
		width: 5rem;
		background: var(--paper);
		color: var(--ink);
		border: 1px solid var(--line);
		border-radius: 4px;
		padding: 0.3rem 0.5rem;
	}

	input[type="checkbox"] { accent-color: var(--patina-strong); }

	button {
		font: inherit;
		font-weight: 600;
		padding: 0.55rem 1.1rem;
		margin-right: 0.6rem;
		border-radius: 6px;
		border: 1px solid var(--line);
		background: var(--paper-raised);
		color: var(--ink);
		cursor: pointer;
	}

	button:hover:not(:disabled) { border-color: var(--patina-strong); }
	button:disabled { opacity: 0.4; cursor: not-allowed; }

	button#connect {
		background: var(--patina-strong);
		border-color: var(--patina-strong);
		color: #0d1512;
	}

	#status {
		margin-top: 1.25rem;
		font-size: 0.88rem;
		white-space: pre-wrap;
		opacity: 0.85;
	}

	.error { color: var(--copper); }
	.ok { color: var(--patina-strong); }

	#form { opacity: 0.35; pointer-events: none; transition: opacity 0.15s; }
	#form.enabled { opacity: 1; pointer-events: auto; }

	footer {
		margin-top: 2.5rem;
		padding-top: 1.25rem;
		border-top: 1px solid var(--line-soft);
		font-size: 0.78rem;
		opacity: 0.55;
	}
</style>
</head>
<body>
<h1>Configure your switch</h1>
<p class="lede">
	Hold either switch input for 10 seconds to open the device's Bluetooth config window (5 minutes,
	or until this page disconnects), then click Connect.
</p>
<div>
	<button id="connect">Connect</button>
	<button id="save" disabled>Save to device</button>
</div>

<form id="form">
	<fieldset>
		<legend>Channels</legend>
		<label><span>Active channels</span>
			<select id="numChannels">
				<option value="1">1</option>
				<option value="2">2</option>
			</select>
		</label>
	</fieldset>

	<fieldset>
		<legend>Timing</legend>
		<label><span>Poll interval (ms)</span><input id="pollMs" type="number" min="1" max="50" /></label>
		<label><span>Long-press / hold threshold (ms)</span><input id="longPressMs" type="number" min="200" max="5000" /></label>
		<label><span>Multi-tap gap (ms)</span><input id="multiGapMs" type="number" min="50" max="2000" /></label>
	</fieldset>

	<fieldset>
		<legend>Channel 1 (SWITCH1)</legend>
		<label><span>Max taps</span><input id="ch0-maxTaps" type="number" min="1" max="5" /></label>
		<label><span>Hold enabled</span><input id="ch0-holdEnabled" type="checkbox" /></label>
	</fieldset>

	<fieldset>
		<legend>Channel 2 (SWITCH2)</legend>
		<label><span>Max taps</span><input id="ch1-maxTaps" type="number" min="1" max="5" /></label>
		<label><span>Hold enabled</span><input id="ch1-holdEnabled" type="checkbox" /></label>
	</fieldset>
</form>

<div id="status"></div>

<footer>Requires Chrome or Edge (Web Bluetooth). <a href="../">&larr; back</a></footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
