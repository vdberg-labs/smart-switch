<!doctype html>
<html lang="en" class="wa-theme-default wa-dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Configure your switch</title>
<style>
	:where(:root), .wa-dark {
		--wa-color-surface-default: #12100d;
		--wa-color-surface-raised: #1b1815;
		--wa-color-surface-border: #3c3a34;
		--wa-color-text-normal: #eceee8;
		--wa-color-text-link: #9ed4c3;
	}

	* { box-sizing: border-box; }

	body {
		font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
		max-width: 32rem;
		margin: 0 auto;
		padding: 3rem 1.25rem 4rem;
	}

	a { color: var(--wa-color-text-link); }

	h1 {
		font-size: 1.4rem;
		font-weight: 700;
		letter-spacing: -0.01em;
		margin-bottom: 0.5rem;
	}

	p.lede {
		opacity: 0.7;
		font-size: 0.92rem;
		line-height: 1.5;
		margin-top: 0;
	}

	.actions {
		display: flex;
		gap: 0.6rem;
		margin-bottom: 1.25rem;
	}

	#form {
		display: flex;
		flex-direction: column;
		gap: 1rem;
		opacity: 0.35;
		pointer-events: none;
		transition: opacity 0.15s;
	}
	#form.enabled { opacity: 1; pointer-events: auto; }

	wa-card { display: block; }
	wa-card::part(body) { display: flex; flex-direction: column; gap: 0.85rem; }
	wa-number-input, wa-select { display: block; }

	.field-row { display: flex; align-items: center; }

	#status:empty { display: none; }
	#status { margin-top: 1.25rem; }

	footer {
		margin-top: 2.5rem;
		padding-top: 1.25rem;
		border-top: 1px solid var(--wa-color-surface-border);
		font-size: 0.78rem;
		opacity: 0.55;
	}
</style>
</head>
<body>
<h1>Configure your switch</h1>
<p class="lede">
	Hold either switch input for 10 seconds to open the device's Bluetooth config window (5 minutes,
	or until this page disconnects), then click Connect.
</p>

<div class="actions">
	<wa-button id="connect" variant="success" appearance="filled">Connect</wa-button>
	<wa-button id="save" disabled>Save to device</wa-button>
</div>

<div id="form"></div>

<div id="status"></div>

<footer>Requires Chrome or Edge (Web Bluetooth). <a href="../">&larr; back</a></footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
